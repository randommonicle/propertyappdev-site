<!DOCTYPE html>
<!-- Source for src/images/og-default.png (1200x630), the image shown when a
     page is shared on LinkedIn, Slack, WhatsApp and so on. Render with the
     command in README.md, "Regenerating images". -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Inter';
    font-weight: 100 900;
    src: url('../src/fonts/inter-latin-wght-normal.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0f1a;
    color: #e8eaed;
    font-family: 'Inter', system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr 380px;
    align-items: center;
    padding: 0 88px;
    border-top: 8px solid #D97706;
  }
  .site { font-size: 22px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #D97706; margin-bottom: 28px; }
  h1 { font-size: 92px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; margin-bottom: 28px; }
  .role { font-size: 36px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; color: #e8eaed; margin-bottom: 18px; }
  .place { font-size: 26px; color: #9ca3af; }
  .portrait { position: relative; width: 380px; height: 380px; }
  .portrait svg { position: absolute; inset: 0; }
  .portrait img {
    position: absolute; top: 50px; left: 50px; width: 280px; height: 280px;
    border-radius: 50%; object-fit: cover; object-position: 50% 8%;
    border: 4px solid #D97706;
  }
</style>
</head>
<body>
  <div>
    <p class="site">bengraham.uk</p>
    <h1>Ben Graham</h1>
    <p class="role">Senior Property Manager<br>and AI Lead</p>
    <p class="place">Cheltenham, Gloucestershire</p>
  </div>
  <div class="portrait">
    <svg viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="190" cy="190" r="186" stroke="#D97706" stroke-width="2" stroke-dasharray="6 12" opacity="0.45"/>
    </svg>
    <img src="../src/images/headshot.jpg" alt="">
  </div>
</body>
</html>
