[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The Netlify subdomain served a duplicate copy of the site. Send it to the
# real domain. Deploy previews use other hostnames and are unaffected.
[[redirects]]
  from = "https://bengrahamportfolio.netlify.app/*"
  to   = "https://bengraham.uk/:splat"
  status = 301
  force = true

# Redirect /index.html to / (canonical)
[[redirects]]
  from = "/index.html"
  to   = "/"
  status = 301

# Netlify Forms success redirect
[[redirects]]
  from   = "/success"
  to     = "/?success=true"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CV stays downloadable from the site but out of search results
[[headers]]
  for = "/cv/*"
  [headers.values]
    X-Robots-Tag = "noindex"
